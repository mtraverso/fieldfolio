name: Jobslip
options:
  bundleIdPrefix: com.fieldfolio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  knownRegions:
    - en
    - es
    - Base
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "2SZYP4X656"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Jobslip:
    type: application
    platform: iOS
    sources:
      - path: Jobslip
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fieldfolio.app
        INFOPLIST_FILE: Jobslip/Info.plist
        CODE_SIGN_ENTITLEMENTS: Jobslip/Jobslip.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: FieldFolio
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    entitlements:
      path: Jobslip/Jobslip.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fieldfolio.app
    dependencies:
      - target: JobslipWidget
        embed: true
    postbuildScripts:
      - name: Resign Simulator App Groups
        path: Scripts/resign-app-groups.sh
        basedOnDependencyAnalysis: false
  JobslipWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: JobslipWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fieldfolio.app.widget
        CODE_SIGN_ENTITLEMENTS: JobslipWidget/JobslipWidget.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: FieldFolio
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: JobslipWidget/JobslipWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fieldfolio.app
    postbuildScripts:
      - name: Resign Simulator App Groups
        path: Scripts/resign-app-groups.sh
        basedOnDependencyAnalysis: false
    info:
      path: JobslipWidget/Info.plist
      properties:
        CFBundleDisplayName: FieldFolio
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Jobslip:
    build:
      targets:
        Jobslip: all
        JobslipWidget: all
    run:
      config: Debug
      storeKitConfiguration: Jobslip/Jobslip.storekit
      # Path is relative to the .xcodeproj parent (repo root).
